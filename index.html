<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EJÉRCITO BMT</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #050505;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        /* =========================
           BARRA SUPERIOR
        ========================= */

        header {
            width: 100%;
            background: #080808;
            border-bottom: 1px solid #b8860b;
            box-shadow: 0 0 18px rgba(218, 165, 32, 0.12);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            max-width: 1250px;
            margin: auto;
            padding: 18px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .logo {
            color: #d4af37;
            font-family: "Press Start 2P", monospace;
            font-size: 18px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.35);
            white-space: nowrap;
        }

        nav {
            display: flex;
            gap: 28px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-family: "Orbitron", sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: 0.25s;
        }

        nav a:hover {
            color: #d4af37;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.45);
        }

        /* =========================
           PORTADA
        ========================= */

        .hero {
            min-height: 620px;
            max-width: 1250px;
            margin: auto;
            padding: 100px 30px 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .hero-content {
            max-width: 900px;
        }

        .small-title {
            color: #d4af37;
            font-family: "Orbitron", sans-serif;
            font-size: 14px;
            letter-spacing: 5px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .hero h1 {
            color: #f1d36b;
            font-family: "Press Start 2P", monospace;
            font-size: clamp(28px, 5vw, 58px);
            line-height: 1.5;
            text-shadow:
                0 0 8px rgba(212, 175, 55, 0.4),
                0 0 25px rgba(212, 175, 55, 0.12);
            margin-bottom: 25px;
        }

        .hero h2 {
            color: #ffffff;
            font-family: "Orbitron", sans-serif;
            font-size: clamp(18px, 3vw, 30px);
            letter-spacing: 5px;
            margin-bottom: 25px;
        }

        .hero p {
            color: #bdbdbd;
            font-size: 17px;
            line-height: 1.8;
            max-width: 700px;
            margin: auto;
        }

        .gold-line {
            width: 100px;
            height: 2px;
            background: #d4af37;
            margin: 30px auto;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        /* =========================
           BOTONES
        ========================= */

        .buttons {
            margin-top: 38px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 15px 25px;
            border: 1px solid #d4af37;
            color: #d4af37;
            background: #0b0b0b;
            text-decoration: none;
            font-family: "Orbitron", sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: 0.25s;
        }

        .button:hover {
            background: #d4af37;
            color: #050505;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.35);
        }

        .button-primary {
            background: #d4af37;
            color: #050505;
        }

        .button-primary:hover {
            background: #f1d36b;
        }

        /* =========================
           SECCIONES
        ========================= */

        section {
            max-width: 1150px;
            margin: auto;
            padding: 90px 30px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 55px;
        }

        .section-title h2 {
            color: #d4af37;
            font-family: "Press Start 2P", monospace;
            font-size: clamp(20px, 3vw, 32px);
            line-height: 1.6;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .section-title p {
            color: #8f8f8f;
            margin-top: 18px;
            font-size: 15px;
        }

        /* =========================
           TARJETAS
        ========================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: #0b0b0b;
            border: 1px solid #242424;
            border-top: 2px solid #9c7615;
            padding: 30px;
            transition: 0.25s;
        }

        .card:hover {
            border-color: #d4af37;
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .card h3 {
            color: #e0bd4d;
            font-family: "Orbitron", sans-serif;
            font-size: 17px;
            margin-bottom: 15px;
        }

        .card p {
            color: #bdbdbd;
            line-height: 1.7;
            font-size: 14px;
        }

        /* =========================
           RANGOS
        ========================= */

        .rank-list {
            border-top: 1px solid #282828;
        }

        .rank {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 24px 10px;
            border-bottom: 1px solid #242424;
        }

        .rank-name {
            color: #d4af37;
            font-family: "Orbitron", sans-serif;
            font-weight: 700;
        }

        .rank-info {
            color: #aaa;
            text-align: right;
        }

        /* =========================
           DIVISOR
        ========================= */

        .divider {
            max-width: 1100px;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                #8c6915,
                transparent
            );
            margin: auto;
        }

        /* =========================
           PIE
        ========================= */

        footer {
            border-top: 1px solid #252525;
            background: #070707;
            text-align: center;
            padding: 45px 25px;
        }

        footer .footer-title {
            color: #d4af37;
            font-family: "Press Start 2P", monospace;
            font-size: 14px;
            margin-bottom: 18px;
        }

        footer p {
            color: #777;
            font-size: 13px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {
            .navbar {
                flex-direction: column;
                padding: 20px;
            }

            nav {
                justify-content: center;
                gap: 18px;
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 18px 15px;
            }

            .logo {
                font-size: 13px;
            }

            nav {
                gap: 12px;
            }

            nav a {
                font-size: 10px;
            }

            .hero {
                padding: 80px 20px;
                min-height: 550px;
            }

            .hero h1 {
                font-size: 23px;
            }

            .hero h2 {
                font-size: 16px;
                letter-spacing: 2px;
            }

            .hero p {
                font-size: 15px;
            }

            section {
                padding: 65px 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .rank {
                align-items: flex-start;
                flex-direction: column;
            }

            .rank-info {
                text-align: left;
            }
        }
    </style>
</head>

                <a href="#departamentos">DEPARTAMENTOS</a>
                <a href="#reglamento">REGLAMENTO</a>
                <a href="#pagos">PAGOS</a>
            </nav>

        </div>
    </header>
